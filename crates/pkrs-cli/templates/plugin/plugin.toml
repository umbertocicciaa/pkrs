# Plugin manifest (docs/design.md §9.4). The folder name must match `plugin.id`.

[plugin]
id          = "{{id}}"
name        = "{{name}}"
version     = "0.1.0"
api         = {{api}}   # scripting API level this plugin targets (§9.7)
description = "Describe what {{name}} adds to the game."

