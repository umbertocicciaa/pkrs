# Fixture for the scripted-input test harness (design §15.2): a small town with an NPC who
# talks and asks a question, a sign and a warp into a house. `tests/*.lua` are its scenarios.
[game]
name    = "Scenario Town"
id      = "com.example.scenario-town"
version = "0.1.0"

[engine]
version = "0.0"
api     = 1

[display]
width  = 240
height = 160
scale  = 3

[start]
map      = "town"
position = [5, 7]
facing   = "up"

[features]
battles = false
party   = false
