[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/umbertocicciaa/pkrs"
publish = false

[workspace.dependencies]
# Internal crates (edges must match docs/design.md §4.3; checked by
# crates/pkrs-cli/tests/crate_graph.rs).
pkrs-core = { path = "crates/pkrs-core" }
pkrs-platform = { path = "crates/pkrs-platform" }
pkrs-assets = { path = "crates/pkrs-assets" }
pkrs-data = { path = "crates/pkrs-data" }
pkrs-render = { path = "crates/pkrs-render" }
pkrs-audio = { path = "crates/pkrs-audio" }
pkrs-world = { path = "crates/pkrs-world" }
pkrs-battle = { path = "crates/pkrs-battle" }
pkrs-script = { path = "crates/pkrs-script" }
pkrs-save = { path = "crates/pkrs-save" }
pkrs-ui = { path = "crates/pkrs-ui" }

# Not-wrapped third-party crates (§4.5).
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev-only.
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# §15.4: no unwrap()/expect() in library code. Tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
