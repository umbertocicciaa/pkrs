name: Documentation task
description: A focused documentation task (guide, reference, example, docs site or release docs). Does not need to follow the design doc.
title: "docs: <short imperative summary>"
labels: ["documentation", "type:task", "area:docs"]
body:
  - type: markdown
    attributes:
      value: |
        One task = one PR. Docs describe **what actually ships**: the code and the current release are the source of truth, not the design doc.
        Docs tasks are tracked under the **[Epic] M8 · Documentation** epic.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this task documents or changes, in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Who needs this and what they can't do (or keep getting wrong) without it.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Audience
      multiple: true
      options:
        - Game authors (no Rust)
        - Plugin authors (Lua)
        - Engine contributors (Rust)
        - Maintainers / release
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of docs
      multiple: true
      options:
        - Getting started / tutorial
        - How-to guide
        - Reference (config keys, CLI, Lua API)
        - Example walkthrough
        - Explanation / concepts
        - Docs site & CI/CD (MkDocs, GitHub Pages)
        - README / CHANGELOG / release notes
        - Rustdoc (API comments)
    validations:
      required: true

  - type: textarea
    id: pages
    attributes:
      label: Pages affected
      description: Files or site pages to add or change, and where they go in the `mkdocs.yml` nav.
      placeholder: |
        - docs/getting-started/install.md (new, nav: Getting started → Install)
        - README.md
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete content or work items as a checklist.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is deliberately left for another issue.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes a reviewer can check.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, code paths, external docs.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must land first (e.g. the feature being documented).
      placeholder: "Blocked by #"

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: "`mkdocs build --strict` passes (no broken links, missing nav entries or warnings)"
          required: true
        - label: Every command, config snippet and code sample was run or checked against the current release
          required: true
        - label: Platform-specific steps checked on Linux, Windows and macOS (or marked as untested)
          required: true
        - label: New pages added to the `mkdocs.yml` nav and cross-linked from related pages
          required: true
        - label: No third-party franchise names or assets; images and assets have a recorded license
          required: true
        - label: Written in English, in neutral engine terminology (creature, species, move, trainer)
          required: true
