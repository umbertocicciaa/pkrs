# Fixture for wild encounters (design §6.2, §6.3, §15.2): a route with a tall-grass patch
# inside an `encounters` rect that references `data/encounters/route_grass.ron`. The rect
# also covers plain ground, where the table's terrain filter keeps encounters off.
# `tests/*.lua` are its scenarios; `data/trainers/player.ron` is the player's party until
# the save-backed party lands (§12).
[game]
name    = "Grass Route"
id      = "com.example.grass-route"
version = "0.1.0"

[engine]
version = "0.0"
api     = 1

[display]
width  = 240
height = 160
scale  = 3

[start]
map      = "route"
position = [5, 7]
facing   = "up"

[features]
battles = true
party   = true
