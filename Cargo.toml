[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/umbertocicciaa/pkrs"
publish = false

[workspace.dependencies]
# Internal crates (edges must match docs/design.md §4.3; checked by
# crates/pkrs-cli/tests/crate_graph.rs).
pkrs-core = { path = "crates/pkrs-core" }
pkrs-platform = { path = "crates/pkrs-platform" }
pkrs-assets = { path = "crates/pkrs-assets" }
pkrs-data = { path = "crates/pkrs-data" }
pkrs-render = { path = "crates/pkrs-render" }
pkrs-audio = { path = "crates/pkrs-audio" }
pkrs-world = { path = "crates/pkrs-world" }
pkrs-battle = { path = "crates/pkrs-battle" }
pkrs-script = { path = "crates/pkrs-script" }
pkrs-save = { path = "crates/pkrs-save" }
pkrs-ui = { path = "crates/pkrs-ui" }
pkrs-cli = { path = "crates/pkrs-cli" }

# Not-wrapped third-party crates (§4.5).
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
rand_core = "0.6"
rand_pcg = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
semver = "1"
serde_path_to_error = "0.1"
ron = "0.8"

# Wrapped vendor crates (§4.5): each may only be used by its owning crate
# (enforced by deny.toml [bans] wrappers).
macroquad = "0.4"
directories = "6"
# Lua 5.4 compiled from vendored C sources (no system Lua, §0.4). 0.11 keeps MSRV 1.85.
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
# `zstd` (default) compiles C code; v1 maps use CSV/base64(+zlib/gzip) layer data only.
tiled = { version = "0.16", default-features = false }

# Binaries only (not wrapped, §4.5): CLI parsing and embedded templates.
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
# `pkrs check` diagnostics rendering (CLI report adapter only, §4.5).
miette = { version = "7", default-features = false, features = ["fancy-no-backtrace"] }

# Dev-only.
serde_json = "1"
insta = { version = "1", features = ["redactions"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# §15.4: no unwrap()/expect() in library code. Tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
