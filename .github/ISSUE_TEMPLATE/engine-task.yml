name: Engine task
description: A focused, PR-sized implementation task derived from the design doc (docs/design.md).
title: "<area>: <short imperative summary>"
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        One task = one PR. Link the design-doc section it implements and keep scope tight.
        Every task ships with **unit and integration tests**; a task is not done until CI is green on Linux, Windows and macOS.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this task delivers and why, in 2–4 sentences.
    validations:
      required: true

  - type: input
    id: design-ref
    attributes:
      label: Design reference
      description: Section(s) of docs/design.md this task implements.
      placeholder: "§4.5 External dependency isolation, §5.1 Pixel-perfect output"
    validations:
      required: true

  - type: dropdown
    id: crate
    attributes:
      label: Crate(s)
      multiple: true
      options:
        - pkrs-core
        - pkrs-platform
        - pkrs-assets
        - pkrs-data
        - pkrs-render
        - pkrs-audio
        - pkrs-world
        - pkrs-battle
        - pkrs-script
        - pkrs-save
        - pkrs-ui
        - pkrs-runtime
        - pkrs-cli
        - CI / tooling
        - templates / examples
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete work items as a checklist.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is deliberately left for another issue.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, verifiable outcomes.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: unit-tests
    attributes:
      label: Unit tests
      description: Which behaviours are covered by unit tests (pure logic, ports with Null/Memory adapters, edge cases, error paths).
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: integration-tests
    attributes:
      label: Integration tests
      description: Cross-crate / end-to-end coverage (crate `tests/` folder, headless runtime with Null adapters, scripted-input `tests/*.lua`, CLI invoked on fixture projects).
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must land first (e.g. "Blocked by #12").
      placeholder: "Blocked by #"

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: Unit tests written and passing (`cargo test --workspace`)
          required: true
        - label: Integration tests written and passing
          required: true
        - label: "`cargo fmt --check` and `cargo clippy --workspace --all-targets -- -D warnings` clean"
          required: true
        - label: CI green on Linux, Windows and macOS
          required: true
        - label: No vendor type in any public signature; vendor crates only in their owning adapter module (§4.5)
          required: true
        - label: No `unwrap()`/`expect()` in library code reachable from content or scripts (§15.4)
          required: true
        - label: Public API documented; design doc updated if the implementation diverges
          required: true
