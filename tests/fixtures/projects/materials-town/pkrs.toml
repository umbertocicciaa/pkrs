# Fixture for custom materials (design §5.6): the ground layer uses a day/night tint, the
# tileset's water tiles animate, and a ghost NPC uses a project GLSL shader. `scripts/main.lua`
# cycles the day/night tint through `render.set_global_uniform`.
[game]
name    = "Materials Town"
id      = "com.example.materials-town"
version = "0.1.0"

[engine]
version = "0.0"
api     = 1

[display]
width  = 240
height = 160
scale  = 3

[start]
map      = "town"
position = [1, 1]
facing   = "down"

[features]
battles = false
party   = false
