# Per-PR CI: docs/design.md §14.4 (matrix) and §15.3 (gates).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # X11 / GL / ALSA / udev headers needed by miniquad (macroquad), kira (cpal) and gilrs.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev

      # The toolchain (and rustfmt/clippy) is pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

  # §14.4 smoke test: the runtime runs a fixture project headless (Null adapters, no GPU)
  # driven by the scripted-input scenario `tests/smoke.lua` (§15.2), capped at 600 ticks, and
  # must exit 0. A failed expectation, error or panic yields a non-zero status and fails the
  # job. The full scenario suite runs in `cargo test` (crates/pkrs-runtime/tests/scenarios.rs).
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev xvfb

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build runtime
        run: cargo build -p pkrs-runtime --locked

      - name: Headless smoke run (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/debug/pkrs-runtime --headless --ticks 600 --project tests/fixtures/projects/scenario-town --script tests/smoke.lua

      - name: Headless smoke run
        if: runner.os != 'Linux'
        shell: bash
        run: ./target/debug/pkrs-runtime --headless --ticks 600 --project tests/fixtures/projects/scenario-town --script tests/smoke.lua

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --locked check advisories bans licenses sources
